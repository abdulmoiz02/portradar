[package]
name = "portwatch"
version = "0.1.0"
edition = "2024"
description = "Interactive terminal dashboard to monitor and manage network ports on Linux"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
nix = { version = "0.31.3", features = ["signal", "user"] }
procfs = "0.18.0"
ratatui = "0.30.2"
