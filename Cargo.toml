[package]
name = "portradar"
version = "0.1.0"
edition = "2024"
description = "Interactive terminal dashboard to monitor and manage network ports on Linux"
readme = "README.md"
license = "MIT"
repository = "https://github.com/abdulmoiz02/portradar"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dns-lookup = "4.0.2"
nix = { version = "0.31.3", features = ["signal", "user"] }
procfs = "0.18.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
